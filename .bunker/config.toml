# runs in each worktree before the agent: each example is its own project with its own lockfile
setup = "for d in basic-api basic-orm nested-routes; do (cd $d && bun install --frozen-lockfile) || exit 1; done"

# must pass before anything is pushed: every example's own tests, run locally (there is no CI; #36)
verify = "for d in basic-api basic-orm nested-routes; do (cd $d && bun test) || exit 1; done"

[merge]
# No CI and no required status check: bunker opens the PR and the maintainer merges it (#36)
mode = "manual"

[models]
# Opus 5.5 for every bunker role in this repo (#36, same as the other bunary packages)
default = "claude-opus-5-5"
